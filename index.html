/* ---- Claymorphism pastel ---- */
[data-theme^=clay]{--bg:#F7EFF8;--card:#FFFDFE;--card2:#F4EBFB;--line:#EBDDF3;--ink:#3A2D55;--mute:#8C80A6;--y:#FFE07C;--yt:#8B5BD8;--on-y:#3A2D55;
 --hero-bg:#D7C6FA;--hero-ink:#2F2348;--hero-mute:#584A7C;--hero-acc:#FFF6C2;--hero-line:transparent;--st1:#FFE07C;--st2:#F7BFD6;--rad:30px;
 --shadow:0 18px 32px -16px rgba(120,80,175,.38),inset -6px -6px 14px rgba(150,110,205,.13),inset 6px 6px 14px rgba(255,255,255,.95);
 --out:0 9px 16px -8px rgba(120,80,175,.45),inset -3px -3px 7px rgba(110,70,160,.12),inset 3px 3px 7px rgba(255,255,255,.85)}
[data-theme^=clay] body{background:radial-gradient(circle at 8% 0%,#FFE1EC 0,transparent 38%),radial-gradient(circle at 95% 18%,#DDF4EA 0,transparent 40%),radial-gradient(circle at 50% 100%,#E6E0FF 0,transparent 45%),#F7EFF8;background-attachment:fixed}
[data-theme^=clay] .card,[data-theme^=clay] .hero,[data-theme^=clay] .pb,[data-theme^=clay] .slogan{border:0;border-radius:var(--rad);box-shadow:var(--shadow)}
[data-theme^=clay] .phases .card:nth-child(1){background:#EFE6FF}
[data-theme^=clay] .phases .card:nth-child(2){background:#E2F5EC}
[data-theme^=clay] .phases .card:nth-child(3){background:#FFE8EF}
[data-theme^=clay] .side{background:rgba(255,253,254,.7);border:0;box-shadow:0 0 40px -10px rgba(120,80,175,.3);backdrop-filter:blur(10px)}
[data-theme^=clay] .top{background:rgba(247,239,248,.85);backdrop-filter:blur(10px);border:0}
[data-theme^=clay] .btn,[data-theme^=clay] .scale button.on,[data-theme^=clay] .seg button.on,[data-theme^=clay] .chip.done,[data-theme^=clay] .dots .done,[data-theme^=clay] .ig{box-shadow:var(--out)}
[data-theme^=clay] .btn{border-radius:18px}
[data-theme^=clay] .btn.g{background:var(--card);border-color:transparent}
[data-theme^=clay] .scale button,[data-theme^=clay] .seg button,[data-theme^=clay] .chip,[data-theme^=clay] .dots button{border-color:transparent;border-radius:13px}
[data-theme^=clay] input[type=text],[data-theme^=clay] textarea{border-radius:16px;box-shadow:inset 3px 3px 7px rgba(130,90,180,.12),inset -3px -3px 7px rgba(255,255,255,.9)}
[data-theme^=clay] .tile{border-radius:20px;box-shadow:inset 3px 3px 8px rgba(255,255,255,.9),inset -3px -3px 8px rgba(130,90,180,.1)}
[data-theme^=clay] .mission{background:#FFE9A3}
[data-theme^=neo] .dnum,[data-theme^=clay] .dnum{color:var(--yt)}
[data-theme^=neo] .hero h1 span,[data-theme^=neo] .pb .en{color:#D7A72A}
[data-theme^=clay] .pb .en,[data-theme^=clay] .hero h1 span{color:#FFFFFF;text-shadow:0 3px 0 rgba(120,80,175,.25)}
[data-theme^=clay] .nl .b{background:#CDB8F5;color:#2F2348}
[data-theme^=clay] .seg button.on[data-val=no]{background:#F7BFD6;color:#3A2D55;border-color:#F7BFD6}
/* ---- Claymorphism dark ---- */
[data-theme=clay-dark]{--bg:#231D33;--card:#2F2745;--card2:#3A3154;--line:#463B63;--ink:#F3EDFC;--mute:#B4A9CD;--y:#FFE07C;--yt:#CDB6FF;--on-y:#2F2348;
 --hero-bg:#5A4894;--hero-ink:#FFFFFF;--hero-mute:#DCD2F7;--hero-acc:#FFE07C;--st1:#FFE07C;--st2:#F7BFD6;
 --shadow:0 18px 32px -14px rgba(0,0,0,.65),inset -6px -6px 14px rgba(0,0,0,.2),inset 6px 6px 14px rgba(255,255,255,.07);
 --out:0 9px 16px -8px rgba(0,0,0,.6),inset -3px -3px 7px rgba(0,0,0,.18),inset 3px 3px 7px rgba(255,255,255,.12)}
[data-theme=clay-dark] body{background:radial-gradient(circle at 8% 0%,#3D2A4C 0,transparent 38%),radial-gradient(circle at 95% 18%,#1F3B37 0,transparent 40%),radial-gradient(circle at 50% 100%,#302B5A 0,transparent 45%),#231D33;background-attachment:fixed}
[data-theme=clay-dark] .phases .card:nth-child(1){background:#3A2F5C}
[data-theme=clay-dark] .phases .card:nth-child(2){background:#24413B}
[data-theme=clay-dark] .phases .card:nth-child(3){background:#4A2D3E}
[data-theme=clay-dark] .side{background:rgba(47,39,69,.78)}
[data-theme=clay-dark] .top{background:rgba(35,29,51,.88)}
[data-theme=clay-dark] input[type=text],[data-theme=clay-dark] textarea{box-shadow:inset 3px 3px 7px rgba(0,0,0,.28),inset -3px -3px 7px rgba(255,255,255,.04)}
[data-theme=clay-dark] .tile{box-shadow:inset 3px 3px 8px rgba(0,0,0,.25),inset -3px -3px 8px rgba(255,255,255,.04)}
[data-theme=clay-dark] .hero h1 span,[data-theme=clay-dark] .pb .en{color:#FFE07C;text-shadow:none}
[data-theme=neo-dark] .seg button.on[data-val=no]{background:#3C4256;color:var(--ink)}
[data-theme=neo-dark] .nl .b{background:#353A4D;color:var(--ink)}
[data-theme=neo-dark] .side{box-shadow:6px 0 22px #20232F}
[data-theme=neo-dark] .top{box-shadow:0 6px 16px #20232F}
[data-theme=neo-dark] .hero h1 span,[data-theme=neo-dark] .pb .en{color:#F2CF6E}
[data-theme=neo-dark] input:focus,[data-theme=neo-dark] textarea:focus{border-color:#F2CF6E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.85 Vazirmatn,Tahoma,sans-serif;transition:background .25s}
button{font:inherit;color:inherit;cursor:pointer}
.en{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.02em;direction:ltr;unicode-bidi:isolate}
.app{min-height:100vh}

/* mobile top */
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.tbar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{font-size:26px;line-height:1;background:none;border:0;padding:0;color:var(--ink)}
.logo span{color:var(--hero-acc)}
.side .logo span,.tbar .logo span{color:var(--yt)}
[data-theme=dark] .side .logo span,[data-theme=dark] .tbar .logo span{color:var(--y)}
.tbar .ptx{display:none}
.icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px;padding:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:0 0 auto;height:38px;min-width:44px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:17px;line-height:1}
.chip.txt{font:500 13px Vazirmatn,sans-serif}
.chip.part{border-color:var(--y)}
.chip.done{background:var(--y);color:var(--on-y);border-color:var(--y)}
.chip.on{outline:2px solid var(--ink);outline-offset:2px}
.chip.today::after{content:"";position:absolute;top:4px;left:50%;width:5px;height:5px;border-radius:50%;background:var(--y);transform:translateX(-50%)}
.chip.done.today::after{background:var(--on-y)}

main{max-width:800px;margin:0 auto;padding:20px 14px 100px}

/* desktop */
@media(min-width:980px){
  .top{display:none}
  .app{display:grid;grid-template-columns:300px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;border-inline-end:1px solid var(--line);padding:24px 16px;background:var(--card)}
  main{padding:40px 40px 110px}
}
.brand{display:flex;flex-direction:column}
.brand .logo{font-size:44px;align-self:flex-start}
.brand small{display:block;color:var(--mute);font-size:11px;letter-spacing:.22em;margin-top:8px}
.pbar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:18px}
.pbar i{display:block;height:100%;background:var(--y);width:0;transition:width .5s}
.side .ptx{display:block;font-size:12px;color:var(--mute);margin:6px 2px 10px}
.grp{font-size:11.5px;color:var(--mute);margin:18px 8px 6px}
.grp .en{color:var(--yt);font-size:13px}
.it{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;background:transparent;border-radius:10px;text-align:start;font-size:14px}
.it:hover{background:var(--card2)}
.it.on{background:var(--card2);box-shadow:inset -3px 0 0 var(--y)}
.it .n{font-size:16px;width:24px;color:var(--mute)}
.it.on .n{color:var(--yt)}
.it .ic{width:24px;text-align:center;color:var(--mute)}
.it .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto}
.it.part .dot{border-color:var(--y)}
.it.done .dot{background:var(--y);border-color:var(--y)}
.it .td{font-size:10.5px;background:var(--y);color:var(--on-y);border-radius:6px;padding:0 6px;line-height:1.8}
.side .foot{margin-top:auto;padding-top:18px;display:flex;gap:8px;flex-wrap:wrap}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
@media(min-width:600px){.card{padding:24px 26px}}
.lab{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin-bottom:12px;font-weight:500}
.lab .en{font-size:15px;color:var(--yt)}
.lab::after{content:"";flex:1;height:1px;background:var(--line)}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--st1) 0 12px,var(--st2) 12px 24px)}

/* hero */
.hero{position:relative;background:var(--hero-bg);color:var(--hero-ink);border-radius:24px;overflow:hidden;padding:0 22px 24px;margin-bottom:14px;border:1px solid var(--hero-line)}
.hero .stripe{margin:0 -22px}
.hero .wb{letter-spacing:.42em;font-size:13px;color:var(--yt);margin-top:22px}
[data-theme=dark] .hero .wb,[data-theme=light] .hero .wb{color:#FFD400}
.hero h1{font-size:clamp(54px,18vw,150px);white-space:nowrap;line-height:.92;margin:6px 0 0;color:var(--hero-ink)}
.hero h1 span{color:var(--hero-acc)}
.hero p{font:800 clamp(17px,3vw,22px)/1.7 Vazirmatn,sans-serif;margin:14px 0 14px;max-width:28em}
.hrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pm{display:inline-block;background:var(--y);color:var(--on-y);padding:3px 12px 1px;border-radius:8px;font-size:18px}
.hd{font-size:13px;color:var(--hero-mute);border:1px solid color-mix(in srgb,var(--hero-mute) 40%,transparent);border-radius:20px;padding:2px 12px}
.hi{margin-top:14px;color:var(--hero-mute);font-size:14px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-color:var(--y)}
.cta small{color:var(--mute)}
.cta h3{margin:2px 0 0;font:800 18px/1.6 Vazirmatn,sans-serif}
.phases{display:grid;gap:12px;margin-bottom:14px}
@media(min-width:760px){.phases{grid-template-columns:repeat(3,1fr)}}
.phases .card{margin:0}
.ph>.en{font-size:30px;color:var(--yt);line-height:1}
.ph h3{font:800 17px Vazirmatn,sans-serif;margin:8px 0 2px}
.ph p{font-size:13px;color:var(--mute);margin:0 0 14px;line-height:1.8}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-size:13px;padding:0}
.dots .done{background:var(--y);color:var(--on-y);border-color:var(--y)}
.dots .part{border-color:var(--y)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.steps div{background:var(--card2);border-radius:12px;padding:10px 4px;text-align:center;font-size:12.5px;line-height:1.6}
.steps .en{display:block;font-size:20px;color:var(--yt)}

/* day */
.dh{display:flex;align-items:flex-end;gap:18px;margin:4px 0 22px}
.dnum{line-height:.84;color:var(--y);flex:0 0 auto}
.dnum small{display:block;font-size:18px;color:var(--ink);letter-spacing:.1em;margin-bottom:8px}
.dnum b{font-weight:400;font-size:80px}
@media(min-width:600px){.dnum b{font-size:104px}}
.dh h1{font:900 clamp(25px,4.6vw,38px)/1.35 Vazirmatn,sans-serif;margin:6px 0 0}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.dtop{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.dtd{font:800 15px Vazirmatn,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:30px;padding:5px 16px;box-shadow:var(--out,none)}
.dtd::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--y);margin-inline-end:8px;vertical-align:middle}
.tag{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:1px 10px;color:var(--mute)}
.tag .en{font-size:12.5px;color:var(--yt)}
.tag.y{background:var(--y);color:var(--on-y);border-color:var(--y);font-weight:700}
.pb{background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;overflow:hidden;padding:0 20px 18px;margin-bottom:18px;border:1px solid var(--hero-line)}
.pb .stripe{margin:0 -20px}
.pb .en{color:var(--hero-acc);font-size:22px;display:block;margin-top:14px}
.pb h2{font:900 21px Vazirmatn,sans-serif;margin:2px 0 4px}
.pb p{margin:0;color:var(--hero-mute);font-size:14px}
.msg{font:800 clamp(19px,3.2vw,24px)/1.75 Vazirmatn,sans-serif;border-inline-start:4px solid var(--y);padding-inline-start:16px;margin:0}
.lt{margin:0}
.lt+ul{margin:8px 0 0;padding-inline-start:20px}
.lt+ul li{margin-bottom:4px}
.lt+ul li::marker{color:var(--yt)}
.la{margin:10px 0 0;color:var(--mute)}
.mission{background:var(--y);color:var(--on-y);border:0;padding-top:0;overflow:hidden}
.mission .stripe{margin:0 -26px 16px;background:repeating-linear-gradient(-45deg,var(--on-y) 0 12px,var(--y) 12px 24px);height:8px;opacity:.9}
.mission .lab{color:rgba(0,0,0,.65)}
.mission .lab .en{color:#0B0B0B}
.mission .lab::after{background:rgba(0,0,0,.18)}
.mission p{font:800 clamp(18px,3vw,21px)/1.75 Vazirmatn,sans-serif;margin:0}
@media(max-width:599px){.mission .stripe{margin:0 -18px 16px}}

/* fields */
.fl{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute);margin:16px 0 6px;font-weight:500}
.card>.fl:first-of-type{margin-top:4px}
input[type=text],textarea{width:100%;font:400 15px/1.8 Vazirmatn,sans-serif;color:var(--ink);background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:9px 13px;transition:border-color .2s}
textarea{resize:vertical;min-height:80px;display:block}
input:focus,textarea:focus{outline:0;border-color:var(--y)}
::placeholder{color:var(--mute);opacity:.65}
.nl{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.nl .b{flex:0 0 auto;min-width:32px;height:32px;padding:0 6px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.bh{font:800 17px Vazirmatn,sans-serif;margin:26px 0 4px;color:var(--ink)}
.bh:first-child{margin-top:0}
.bp{margin:4px 0;color:var(--mute)}
.nq{font:800 17px/1.7 Vazirmatn,sans-serif;margin:4px 0 8px;color:var(--ink)}
.pv2{color:var(--yt);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font:500 14px Vazirmatn,sans-serif;padding:0;transition:background .15s}
.scale button.on{background:var(--y);color:var(--on-y);border-color:var(--y);font-weight:900}
.sr{margin-bottom:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 4px;font-size:13.5px;line-height:1.5}
.seg button.on[data-val=full]{background:var(--y);color:var(--on-y);border-color:var(--y);font-weight:800}
.seg button.on[data-val=half]{border-color:var(--y);color:var(--yt);font-weight:800;background:transparent}
.seg button.on[data-val=no]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:800}
.ck{display:flex;gap:12px;align-items:flex-start;padding:7px 0;cursor:pointer}
.ck input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--y);border-radius:7px;flex:0 0 auto;margin:3px 0 0;display:grid;place-items:center;background:transparent;cursor:pointer}
.ck input:checked{background:var(--y)}
.ck input:checked::after{content:"✓";color:var(--on-y);font-weight:900;font-size:15px;line-height:1}
.ck input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hr{display:grid;grid-template-columns:1fr 90px auto;gap:10px;align-items:center;margin-bottom:8px}
.hr small{color:var(--mute)}
.hr input{text-align:center}
.hsum{text-align:start;font-weight:800;color:var(--yt);margin-top:6px}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card2);border-radius:16px;padding:14px 18px;margin:16px 0 6px}
.timer .clk{font-size:50px;line-height:1;color:var(--yt)}

/* buttons */
a.btn{text-decoration:none;display:inline-block}
.btn{border:0;border-radius:14px;padding:11px 18px;font:700 15px Vazirmatn,sans-serif;background:var(--ink);color:var(--bg);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--y);color:var(--on-y)}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 13px;font-size:13px;font-weight:500}
.lnk{background:none;border:0;padding:0;color:var(--yt);text-decoration:underline;font:inherit}
.share{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.share a.btn{flex:1 1 0;text-align:center;min-width:140px}
@media(min-width:600px){.share a.btn{flex:0 0 auto;min-width:180px}}
.acts{display:flex;flex-wrap:wrap;gap:8px}
details.pv summary{cursor:pointer;color:var(--mute);font-size:13px;margin-top:12px}
pre.pv{white-space:pre-wrap;font:400 13.5px/1.9 Vazirmatn,sans-serif;background:var(--card2);border-radius:12px;padding:12px 14px;margin:8px 0 0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card2);border-radius:14px;padding:12px 14px;min-width:0}
.tile b{display:block;font:900 25px/1.35 Vazirmatn,sans-serif}
.tile small{color:var(--mute);font-size:12px;line-height:1.5;display:block}
.tiles.t3 .tile b{font-size:21px}
.wk4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media(min-width:640px){.wk4{grid-template-columns:repeat(4,1fr)}}
.ol{margin:4px 0;padding-inline-start:20px}
.bars{display:flex;align-items:stretch;gap:4px;height:150px;padding-top:6px}
.bars button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;min-width:0}
.bw{flex:1;width:100%;display:flex;align-items:flex-end}
.bw i{display:block;width:100%;min-height:3px;border-radius:5px 5px 2px 2px;background:var(--line)}
.bars .done i{background:var(--y)}
.bars .part i{background:var(--mute)}
.bars small{font-size:10px;color:var(--mute)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:12px}
.lg{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px;vertical-align:middle;background:var(--line)}
.lg.done{background:var(--y)}.lg.part{background:var(--mute)}
.lg.k0,.lg.k1,.lg.k2,.lg.k3{border-radius:50%}
.k0{background:var(--card)!important;border:2px solid var(--mute)}
.k1{background:var(--mute)!important;opacity:.4}
.k2{background:var(--mute)!important}
.k3{background:var(--y)!important}
.tr{display:grid;grid-template-columns:120px 1fr 44px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}

const $=s=>document.querySelector(s);
const range=(a,b)=>Array.from({length:Math.max(0,b-a+1)},(_,i)=>a+i);
const fa=x=>String(x).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]).replace(/\./g,"٫");
const pad=n=>String(n).padStart(2,"0");
const esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const toEn=s=>String(s==null?"":s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,]/g,".");
const f1=x=>x==null?"—":fa(Math.round(x*10)/10);
const sgn=d=>(d>0?"+":d<0?"−":"")+fa(Math.round(Math.abs(d)*10)/10);
const WD=["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];
const pDate=n=>(n<=5?`${fa(25+n)} آبان`:`${fa(n-5)} آذر`)+" ۱۴۰۵";
const wDay=n=>{const d=new Date(START);d.setDate(d.getDate()+n);return WD[d.getDay()]};
const todayIdx=()=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((t-START)/864e5)};
const phaseOf=n=>PH.find(p=>n>=p.from&&n<=p.to);

/* ===== storage ===== */
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){S={}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{persist();toast("ذخیره شد")},450)}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1300)}
const STYLES=[
 {id:"classic",t:"کلاسیک LOCK IN",d:"مشکی، سفید و زرد برند",sw:{dark:"#0B0B0B",light:"#F5F4EE"},c:["#FFD400","#F5F5F0","#2B2B2B"]},
 {id:"neo",t:"نئومورفیسم",d:"برجسته و نرم، پاستلی",sw:{dark:"#2B2F3E",light:"#E7EAF3"},c:["#F6D77A","#CBD2E8","#FFFFFF"]},
 {id:"clay",t:"کلی‌مورفیسم",d:"حجیم و خمیری، پاستلی",sw:{dark:"linear-gradient(135deg,#3D2A4C,#302B5A 55%,#1F3B37)",light:"linear-gradient(135deg,#FFE1EC,#E6E0FF 55%,#DDF4EA)"},c:["#FFE07C","#D7C6FA","#F7BFD6"]}];
let STY="classic",MODE="dark";
const modeLabel=short=>short?(MODE==="dark"?"☀":"☾"):(MODE==="dark"?"☀ حالت روشن":"☾ حالت تاریک");
function applyTheme(){const th=STY==="classic"?MODE:(MODE==="dark"?STY+"-dark":STY);document.documentElement.dataset.theme=th;
  try{localStorage.setItem(THEME_KEY,JSON.stringify({s:STY,m:MODE}))}catch(e){}
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()||"#0B0B0B";
  document.querySelectorAll(".topt").forEach(b=>b.classList.toggle("on",b.dataset.th===STY));
  document.querySelectorAll("[data-act=mode]").forEach(b=>{b.textContent=modeLabel(b.dataset.short)})}
function themePicker(){
  return `<div class="tp" role="dialog" aria-label="سبک طراحی"><h3>سبک طراحی</h3><p>سبک ظاهری ورک‌بوکو انتخاب کن. تاریک یا روشن بودنش با یه دکمه جدا عوض می‌شه و به جوابات دست نمی‌خوره.</p><div class="tgrid">${STYLES.map(x=>`<button class="topt ${STY===x.id?"on":""}" data-act="settheme" data-th="${x.id}"><div class="sw" style="background:${x.sw[MODE]}">${x.c.map(c=>`<i style="background:${c};box-shadow:0 1px 3px rgba(0,0,0,.18)"></i>`).join("")}</div>${x.t}<small>${x.d}</small></button>`).join("")}</div><div class="acts" style="margin-top:14px;justify-content:space-between"><button class="btn g sm" data-act="mode">${modeLabel()}</button><button class="btn g sm" data-act="closetheme">بستن</button></div></div>`}
try{const raw=localStorage.getItem(THEME_KEY);if(raw){let o;try{o=JSON.parse(raw)}catch(e){o=raw}
  if(o&&typeof o==="object"){STY=o.s||"classic";MODE=o.m||"dark"}else if(o==="light"){MODE="light"}else if(o==="neo"||o==="clay"){STY=o;MODE="light"}}}catch(e){}
if(!STYLES.some(x=>x.id===STY))STY="classic";if(MODE!=="light")MODE="dark";applyTheme();

/* ===== stats ===== */
const M=n=>S[`d${n}.m`], SC=n=>+S[`d${n}.sc`]||0;
const done=n=>{const d=DAYS[n];if(d&&!d.stub&&n>=1&&n<=21){const t=track(n);return t.learn&&t.ex>=.5&&t.mission>=1&&t.report}return M(n)==="full"&&SC(n)>0};
const ok=n=>M(n)==="full"||M(n)==="half";
const touched=n=>{const p=`d${n}.`;for(const k in S)if(k.startsWith(p)&&S[k]!==""&&S[k]!==false)return true;return false};
const st=n=>done(n)?"done":touched(n)?"part":"";
const doneCount=()=>range(1,21).filter(done).length;
const missions=()=>range(1,21).filter(ok).length;
const avg=(a,b)=>{const v=range(a,b).map(SC).filter(x=>x>0);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const streakAt=n=>{let c=0;for(let i=n;i>=1&&ok(i);i--)c++;return c};
const bestStreak=()=>{let b=0,c=0;for(let n=1;n<=21;n++){c=ok(n)?c+1:0;if(c>b)b=c}return b};
const curStreak=()=>{const t=Math.min(Math.max(todayIdx(),1),21);return streakAt(t)||streakAt(t-1)};
const lifeAvg=n=>{const v=LIFE.map((_,i)=>+S[`d${n}.life.${i}`]||0).filter(x=>x);return v.length?v.reduce((a,b)=>a+b)/v.length:null};
const CPS=[[1,"روز ۱"],[7,"روز ۷"],[14,"روز ۱۴"],[22,"پایان دوره"]];
function prevSkill(n,i){const c=CPS.map(x=>x[0]),idx=c.indexOf(n);for(let j=idx-1;j>=0;j--){const v=S[`d${c[j]}.sk.${i}`];if(v)return v}return null}

function timerHTML(b){const m=b.timer;if(!TM.run&&TM.left===TM.total){TM.total=TM.left=m*60}

function blk(b,n){
  const K=k=>k[0]==="@"?k.slice(1):`d${n}.${k}`;
  if(b.h)return `<h4 class="bh">${b.h}</h4>`;
  if(b.p)return `<p class="bp">${b.p}</p>`;
  if(b.f)return `<label class="fl">${b.l}</label>${inp(K(b.f),b.ph)}`;
  if(b.row)return `<div class="row">${b.row.map(x=>`<div>${blk(x,n)}</div>`).join("")}</div>`;
  if(b.q)return `<label class="fl">${b.l}</label>${ta(K(b.q),b.r||3)}`;
  if(b.list)return `<label class="fl">${b.l}</label><div class="${b.two?"two":""}">${range(0,b.n-1).map(i=>`<div class="nl"><span class="b">${b.pre?b.pre[i]:fa(i+1)}</span>${inp(K(b.list)+"."+i)}</div>`).join("")}</div>`;
  if(b.scale)return `<label class="fl">${b.l}</label>${scale(K(b.scale))}`;
  if(b.life||b.skills){const arr=b.life?LIFE:SKILLS,base=K(b.life||b.skills);
    return arr.map((s,i)=>{const prev=b.life?(n!==1?S[`d1.life.${i}`]:null):prevSkill(n,i);
      return `<div class="sr"><label class="fl"><span>${s}</span>${prev?`<small class="pv2">${b.life?"روز ۱":"قبلی"}: ${fa(prev)}</small>`:""}</label>${scale(base+"."+i)}</div>`}).join("")}
  if(b.checks)return b.items.map((x,i)=>{const k=K(b.checks)+"."+i;return `<label class="ck"><input type="checkbox" data-k="${k}" ${S[k]?"checked":""}><span>${x}</span></label>`}).join("");
  if(b.hours)return `<div style="margin-top:10px">${b.hours.map(([k,l])=>`<div class="hr"><span>${l}</span>${inp(K("h."+k),"۰","decimal")}<small>ساعت</small></div>`).join("")}</div><div class="hsum" data-auto="hours" data-arg="${n}|${b.hours.map(x=>x[0]).join(",")}"></div>`;
  if(b.timer)return timerHTML(b);
  if(b.scale0)return `<label class="fl">${b.l}</label>${scale0(K(b.scale0))}`;
  if(b.pick){const k=K(b.pick),sel=(S[k]||"").split("|").filter(Boolean);
    return `<label class="fl">${b.l}</label><div class="picks" data-pickbox="${k}" data-max="${b.max}">${b.items.map(x=>`<button type="button" class="pk ${sel.includes(x)?"on":""}" data-pick="${k}" data-val="${x}">${x}</button>`).join("")}</div><div class="pkc" data-auto="pickc" data-arg="${k}|${b.max}"></div>`}
  if(b.note)return `<div class="note">${b.note}</div>`;
  if(b.matrix){const k=K(b.matrix);return `<div class="mx">${b.boxes.map((x,i)=>`<div class="mxc mx${i}"><b>${x}</b>${ta(k+"."+i,3)}</div>`).join("")}</div>`}
  if(b.control){const k=K(b.control);const A=["رفتارم","تصمیمام","واکنش‌هام","تلاش و یادگیریم","مدیریت وقتم"],B=["نظر بقیه","گذشته","اتفاقای پیش‌بینی‌نشده","تصمیم بقیه"];
    const col=(t,items,kk,cls)=>`<div class="ctl ${cls}"><b>${t}</b><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul>${inp(kk+".0","یه مورد دیگه از زندگی خودم")}${inp(kk+".1","یه مورد دیگه")}</div>`;
    return `<div class="ctls">${col("توی کنترل من",A,k+".in","in")}${col("بیرون از کنترل مستقیم من",B,k+".out","out")}</div>`}
  if(b.seg2){const k=K(b.seg2);return `<label class="fl">${b.l}</label><div class="seg s2">${b.opts.map((o,i)=>`<button type="button" data-set="${k}" data-val="${i}" class="${S[k]===String(i)?"on":""}">${o}</button>`).join("")}</div>`}
  if(b.sentence){const k=K(b.sentence),P=b.parts;return `<div class="sent"><span>${P[0]}</span>${inp(k+".0","کار فعلی")}<span>${P[1]}</span>${inp(k+".1","عادت جدید")}<span>${P[2]}</span></div>`}
  if(b.rate){const items=b.items,cps=b.cps;
    return items.map((s2,i)=>{const pv=prevCP(b.rate,n,i,cps);
      return `<div class="sr"><label class="fl"><span>${s2}</span>${pv?`<small class="pv2">${pv[0]===0?"روز شروع":"روز "+fa(pv[0])}: ${fa(pv[1])}</small>`:""}</label>${b.zero?scale0(K(b.rate)+"."+i):scale(K(b.rate)+"."+i)}</div>`}).join("")}
  if(b.table){const base=K(b.table),rows=b.rowsL?b.rowsL.length:b.rows,nc=b.cols.length+(b.check?1:0);
    const hint=i=>{if(!b.hint||!b.hint[i])return "";const v=b.hint[i].map(j=>+S[`d0.life.${j}`]).filter(x=>x);return v.length?`<small class="pv2">چکاپ شروع: ${f1(v.reduce((x,y)=>x+y,0)/v.length)}</small>`:""};
    return `<div class="tbl ${b.rowsL?"rl":""}" style="--c:${nc}"><div class="thd">${b.cols.map(c=>`<span>${c}</span>`).join("")}${b.check?`<span class="ckh">${b.check}</span>`:""}</div>${range(0,rows-1).map(i=>`<div class="trw">${b.rowsL?`<span class="rlab">${b.rowsL[i]}${hint(i)}</span>`:`<span class="rn">${fa(i+1)}</span>`}${b.cols.map((c,j)=>inp(`${base}.${i}.${j}`,b.rowsL&&b.cols.length===1?"":c)).join("")}${b.check?`<label class="ck tck"><input type="checkbox" data-k="${base}.${i}.ok" ${S[`${base}.${i}.ok`]?"checked":""}><span>${b.check}</span></label>`:""}</div>`).join("")}</div>`}
  if(b.row2)return `<div class="row">${b.row2.map(x=>`<div>${blk(x,n)}</div>`).join("")}</div>`;
  if(b.vision){const base=K(b.vision);
    return `<div class="vgrid">${b.areas.map((a2,i)=>vcellHTML(`${base}.${i}`,a2)).join("")}</div>`}
  if(b.vmain){const k=K(b.vmain);return `<div class="vmain"><label class="fl">${b.l}</label><span hidden data-trk="${k}.img"></span>${imgBox(k+".img","wide")}${ta(k+".t",2,"جمله اصلی چشم‌اندازت")}</div>`}
  if(b.auto)return `<div data-auto="${b.auto}" data-arg="${b.arg||""}"></div>`;
  if(b.share)return `<h4 class="bh">${b.l}</h4>${shareBtns(b.share)}${preview(b.share)}`;
  if(b.final)return `<h4 class="bh">تعهدنامه پایانی من</h4><p class="msg" style="font-size:17.5px">قول می‌دم برای ساختن زندگی دلخواهم منتظر زمان مناسب، انگیزه کامل یا تأیید بقیه نمونم. قبول دارم که پیشرفت واقعی از تصمیمای کوچیک و کارای پیوسته ساخته می‌شه. قرار نیست بی‌نقص باشم؛ قراره مسئولانه ادامه بدم.</p>
    <div class="row"><div>${blk({f:"@fin.name",l:"اسم و امضا",ph:S.name||""},n)}</div><div>${blk({f:"@fin.date",l:"تاریخ",ph:"۱۷ آذر ۱۴۰۵"},n)}</div></div>
    <div class="slogan"><div class="en yl">YOU LOCKED IN 🔒</div><p class="yt2">کمتر قول بده. آگاهانه تصمیم بگیر. متمرکز عمل کن. و به خودت ثابت کن که می‌تونی ادامه بدی.</p><div class="en">LOCK IN IS NOT A MOOD.<br><span>IT'S A COMMITMENT.</span></div><p class="tr3">LOCK IN یه حس‌وحال گذرا نیست؛ یه تعهده.</p></div>`;
  return "";
}
function learnHTML(l){if(typeof l==="string")return `<p class="lt">${l}</p>`;
  return `<p class="lt">${l.text}</p>${l.bullets?`<ul>${l.bullets.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${l.after?`<p class="la">${l.after}</p>`:""}`}
const card=(no,label,body,cls)=>`<section class="card ${cls||""}"><div class="lab"><span class="en">${no}</span>${label}</div>${body}</section>`;

function prevCP(base,n,i,cps){const idx=cps.indexOf(n);for(let j=idx-1;j>=0;j--){const v=S[`d${cps[j]}.${base}.${i}`];if(v!==undefined)return [cps[j],v]}return null}
const SLOTS=k=>[k+".img",k+".img1",k+".img2"];
function vcellHTML(k,label){const filled=SLOTS(k).filter(x=>S[x]);
  const imgs=filled.length?`<div class="vthumbs">${filled.map(x=>`<div class="vth"><img src="${S[x]}" alt="" data-view="${x}"><button class="vrm" data-act="rmimg" data-key="${x}" aria-label="حذف عکس">×</button></div>`).join("")}${filled.length<3?`<div class="vth add" data-img="${SLOTS(k)[filled.length]}" role="button" aria-label="افزودن عکس">+</div>`:""}</div>`
    :`<div class="vimg" data-img="${k}.img" role="button" tabindex="0" aria-label="انتخاب عکس"><span>+ عکس<small>تا ۳ تا</small></span></div>`;
  return `<div class="vcell" data-vcell="${k}" data-label="${label}" data-trk="${k}.img">${imgs}<div class="vlab">${label}</div>${inp(k+".t","یه کلمه یا جمله")}</div>`}
function refreshImg(k){const cell=document.querySelector(`[data-vcell="${k.replace(/\.img\d?$/,"")}"]`);if(cell){cell.outerHTML=vcellHTML(cell.dataset.vcell,cell.dataset.label);return}
  const box=document.querySelector(`[data-img="${k}"]`);if(box)box.outerHTML=imgBox(k,box.classList.contains("wide")?"wide":"")}
function imgBox(k,cls){const v=S[k];return `<div class="vimg ${cls||""} ${v?"has":""}" data-img="${k}" role="button" tabindex="0" aria-label="انتخاب عکس">${v?`<img src="${v}" alt=""><button class="vrm" data-act="rmimg" data-key="${k}" aria-label="حذف عکس">×</button>`:`<span>+ عکس</span>`}</div>`}
/* ===== daily tracker (auto) ===== */
const EXK={};
function exKeys(n){if(EXK[n])return EXK[n];const d=DAYS[n];if(!d||d.stub)return EXK[n]=[];
  const html=(d.ex||[]).map(b=>blk(b,n)).join("")+(d.extra?d.extra.blocks.map(b=>blk(b,n)).join(""):"");
  const set=new Set();html.replace(/data-(?:k|trk|set|pick)="([^"]+)"/g,(m,k)=>{set.add(k);return m});return EXK[n]=[...set]}
const filled=k=>S[k]!==undefined&&S[k]!==""&&S[k]!==false;
function track(n){const ks=exKeys(n),f=ks.filter(filled).length;
  return {learn:!!S[`d${n}.learn`],ex:ks.length?f/ks.length:0,mission:M(n)==="full"?1:M(n)==="half"?.5:0,report:SC(n)>0}}
function trackHTML(n){const t=track(n);const chip=(l,v)=>`<span class="tk ${v>=1?"on":v>0?"half":""}">${v>=1?"✓":v>0?"◐":"○"} ${l}</span>`;
  return `<div class="tks" data-auto="track" data-arg="${n}">${chip("آموزش",t.learn?1:0)}${chip("تمرین",t.ex>=.5?1:t.ex>0?.5:0)}${chip("مأموریت",t.mission)}${chip("گزارش",t.report?1:0)}</div>`}
function trendHTML(base,items,cps,minOne){let any=false;const lo=minOne?1:0,span=10-lo,pos=x=>(x-lo)/span*100;
  const rows=items.map((s2,i)=>{const have=cps.map(([c],j)=>[S[`d${c}.${base}.${i}`],j]).filter(([x])=>x!==undefined).map(([x,j])=>[+x,j]);
    let inner="",dl="<span></span>";
    if(have.length){any=true;const xs=have.map(a=>a[0]),mn=Math.min(...xs),mx=Math.max(...xs);
      inner=`<i class="sg" style="right:${pos(mn)}%;width:${pos(mx)-pos(mn)}%"></i>`+have.map(([x,j])=>`<i class="pt k${cps.length===2&&j===1?3:j}" style="right:${pos(x)}%" title="${cps[j][1]}: ${x}"></i>`).join("");
      if(have.length>1){const d=have[have.length-1][0]-have[0][0];dl=`<span class="dl ${d>0?"up":""}" dir="ltr">${sgn(d)}</span>`}}
    return `<div class="tr"><span>${s2}</span><div class="track">${inner}</div>${dl}</div>`});
  if(!any)return `<p class="bp">هنوز نمره‌ای ثبت نشده. اولین نمره‌ها توی <button class="lnk" data-v="0">روز ۰۰</button> ثبت می‌شن.</p>`;
  const avgAt=c=>{const v=items.map((_,i)=>S[`d${c}.${base}.${i}`]).filter(x=>x!==undefined).map(Number);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const av=cps.map(([c,l])=>[l,avgAt(c)]).filter(x=>x[1]!=null);
  return `<div class="tr hd"><span></span><div class="scl"><span>${fa(lo)}</span><span>۱۰</span></div><span></span></div>${rows.join("")}<div class="legend">${cps.map(([c,l],j)=>`<span><i class="lg k${cps.length===2&&j===1?3:j}"></i>${l}</span>`).join("")}</div>${av.length>1?`<p class="avgline">میانگین: ${av.map(([l,v])=>`${l} <b>${f1(v)}</b>`).join(" ← ")}</p>`:""}`}
function trackerTable(){const ic=v=>v>=1?'<i class="tc on">✓</i>':v>0?'<i class="tc half">◐</i>':'<i class="tc">·</i>';
  return `<div class="trk"><div class="trh"><span>روز</span><span>آموزش</span><span>تمرین</span><span>مأموریت</span><span>گزارش</span></div>${range(1,21).map(n=>{const t=track(n);return `<button class="trr ${done(n)?"done":""}" data-v="${n}"><span><b class="en">${pad(n)}</b> ${DAYS[n].t}</span>${ic(t.learn?1:0)}${ic(t.ex>=.5?1:t.ex>0?.5:0)}${ic(t.mission)}${ic(t.report?1:0)}</button>`}).join("")}</div>`}

    <div class="plsr">${ring(T?Math.round(D/T*100):0,110)}<div class="cnt">تکمیل شده ${fa(D)} از ${fa(T)}</div><div class="cnt">کل ۲۱ روز: <b>${fa(AT?Math.round(AD/AT*100):0)}٪</b></div></div></div><div class="legend"><span><i class="lg" style="background:var(--line)"></i>کارهای روز</span><span><i class="lg done"></i>انجام شده</span></div>`},
  plwkp:w=>{const [a,b]=PLW[+w],st=range(a,b).map(plStat),D=st.reduce((x,y)=>x+y.dn,0),T=st.reduce((x,y)=>x+y.tot,0);return T?fa(Math.round(D/T*100))+"٪":""},
  plring:n=>ring(plStat(+n).p,84),
  plfoot:n=>{const s2=plStat(+n);return `<span>تکمیل: <b>${fa(s2.dn)}</b></span><span>مونده: <b>${s2.tot-s2.dn?fa(s2.tot-s2.dn):(s2.tot?"✅":"۰")}</b></span>`},
  pltab:n=>{const s2=plStat(+n);return s2.tot?fa(s2.p)+"٪":fa(+n)},

  wk:arg=>{const [a,b]=arg.split("-").map(Number);return `<div class="tiles t3">${tile("روزهای کامل",fa(range(a,b).filter(done).length)+" / ۷")}${tile("میانگین امتیاز",f1(avg(a,b)))}${tile("مأموریت‌ها",fa(range(a,b).filter(ok).length)+" / ۷")}</div>`},
  streak:()=>`<div class="tiles t3">${tile("زنجیره فعلی",fa(curStreak())+" 🔥")}${tile("بهترین زنجیره",fa(bestStreak()))}${tile("مأموریت‌ها",fa(missions())+" / ۲۱")}</div>`,
  lifecmp:()=>{const a=lifeAvg(1),b=lifeAvg(21);return `<div class="tiles t3" style="margin-top:14px">${tile("امتیاز اولیه زندگی (روز ۱)",f1(a))}${tile("امتیاز فعلی زندگی",f1(b))}${tile("تغییر",a!=null&&b!=null?`<span dir="ltr">${sgn(b-a)}</span>`:"—")}</div>`},
  hours:a=>{const [n,ks]=a.split("|");const v=ks.split(",").map(k=>parseFloat(toEn(S[`d${n}.h.${k}`]))||0);const s2=v.reduce((x,y)=>x+y,0);return s2?`جمع: ${fa(Math.round(s2*10)/10)} ساعت`:""},
  bars:()=>`<div class="bars">${range(1,21).map(n=>`<button data-v="${n}" class="${st(n)}" title="روز ${fa(n)}"><span class="bw"><i style="height:${SC(n)*10}%"></i></span><small>${fa(n)}</small></button>`).join("")}</div>`,
  trendSk:()=>trendHTML("sk",SKILLS10,[[0,"قبل از دوره"],[22,"بعد از دوره"]],0),
  trendLife:()=>trendHTML("life",LIFE8,[[0,"روز شروع"],[7,"پایان فصل ۱"],[14,"پایان فصل ۲"],[22,"پایان دوره"]],1),
  partnerName:()=>`<label class="fl">پارتنرم</label><div class="pn">${S.partner?esc(S.partner):'<span style="color:var(--mute)">هنوز اسم پارتنرتو توی <button class="lnk" data-v="0">روز ۰۰</button> ننوشتی.</span>'}</div>`,
  pickc:a=>{const [k,mx]=a.split("|");const c=(S[k]||"").split("|").filter(Boolean).length;return c?`${fa(c)} از ${fa(mx)} تا انتخاب شده`:""},

    if(!g.some(Boolean))return `<p class="bp">برنامه ۳۰ روزه‌ت هنوز خالیه. <button class="lnk" data-v="21">برو به روز ۲۱</button></p>`;
    return `<div class="wk4">${g.map((x,i)=>`<div class="tile"><small>هدف ${fa(i+1)}</small><div>${x?esc(x):"—"}</div>${S[`d21.plan.${i}.0`]?`<small>اقدام هفتگی: ${esc(S[`d21.plan.${i}.0`])}</small>`:""}${S[`d21.plan.${i}.1`]?`<small>معیار: ${esc(S[`d21.plan.${i}.1`])}</small>`:""}</div>`).join("")}</div>`},

const clean=l=>String(l||"").replace(/[:：]\s*$/,"").replace(/…$/,"").trim();
const LB=x=>{const c=clean(x);return /[؟?]$/.test(c)?c:c+":"};
const V=k=>{const v=S[k];return v===undefined||v===""||v===false?null:String(v).trim()};
function blkText(b,n){const K=k=>k[0]==="@"?k.slice(1):`d${n}.${k}`,L=[];
  if(b.h)L.push("","▪️ "+b.h);
  else if(b.f||b.q){const v=V(K(b.f||b.q));if(v)L.push(LB(b.l),"← "+v)}
  else if(b.row||b.row2)(b.row||b.row2).forEach(x=>L.push(...blkText(x,n)));
  else if(b.list){const vs=range(0,b.n-1).map(i=>[i,V(K(b.list)+"."+i)]).filter(x=>x[1]);if(vs.length){L.push(LB(b.l));vs.forEach(([i,v])=>L.push(`${b.pre?b.pre[i]:fa(i+1)}. ${v}`))}}
  else if(b.pick){const v=V(K(b.pick));if(v)L.push(LB(b.l),"← "+v.split("|").join("، "))}
  else if(b.scale||b.scale0){const v=V(K(b.scale||b.scale0));if(v!=null)L.push(`${clean(b.l)}: ${fa(v)}/۱۰`)}
  else if(b.rate){const vs=b.items.map((x,i)=>[x,V(K(b.rate)+"."+i)]).filter(x=>x[1]!=null);if(vs.length)vs.forEach(([x,v])=>L.push(`• ${x}: ${fa(v)}`))}
  else if(b.table){const rows=b.rowsL?b.rowsL.length:b.rows;for(let i=0;i<rows;i++){const cells=b.cols.map((c,j)=>[c,V(`${K(b.table)}.${i}.${j}`)]).filter(x=>x[1]);const ok=b.check&&S[`${K(b.table)}.${i}.ok`];
    if(cells.length||ok)L.push(`${b.rowsL?b.rowsL[i]:fa(i+1)}: `+cells.map(([c,v])=>b.cols.length>1?`${c}: ${v}`:v).join(" | ")+(ok?` ✓ ${b.check}`:""))}}
  else if(b.matrix)b.boxes.forEach((x,i)=>{const v=V(K(b.matrix)+"."+i);if(v)L.push(`${x}:`,"← "+v)});
  else if(b.control){[["in","توی کنترل من"],["out","بیرون از کنترل من"]].forEach(([k,t])=>{const vs=[0,1].map(i=>V(`${K(b.control)}.${k}.${i}`)).filter(Boolean);if(vs.length)L.push(`${t} (موارد خودم): ${vs.join("، ")}`)})}
  else if(b.seg2){const v=V(K(b.seg2));if(v!=null)L.push(`${clean(b.l)}: ${b.opts[+v]}`)}
  else if(b.sentence){const a=V(K(b.sentence)+".0"),c=V(K(b.sentence)+".1");if(a||c)L.push(`${b.parts[0]} ${a||"…"} ${b.parts[1]} ${c||"…"} ${b.parts[2]}`)}
  else if(b.vision){b.areas.forEach((x,i)=>{const t=V(`${K(b.vision)}.${i}.t`),im=SLOTS(`${K(b.vision)}.${i}`).filter(z=>S[z]).length;if(t||im)L.push(`${x}: ${[t,im?`(${fa(im)} عکس گذاشته)`:""].filter(Boolean).join(" ")}`)})}
  else if(b.vmain){const t=V(K(b.vmain)+".t");if(t)L.push(LB(b.l),"← "+t)}
  else if(b.hours){const vs=b.hours.map(([k,l])=>[l,V(K("h."+k))]).filter(x=>x[1]);vs.forEach(([l,v])=>L.push(`${l}: ${v} ساعت`))}
  return L}

function tgTarget(raw){let v=toEn(raw).trim().replace(/^https?:\/\/(www\.)?(t|telegram)\.me\//i,"").replace(/^@/,"").replace(/[\s\-()]/g,"");
  if(!v)return null;
  if(/^\+?\d{7,15}$/.test(v)){if(v.startsWith("+"))return "+"+v.slice(1);if(v.startsWith("00"))return "+"+v.slice(2);if(v.startsWith("0"))return "+98"+v.slice(1);if(v.startsWith("98"))return "+"+v;if(v.startsWith("9")&&v.length===10)return "+98"+v;return "+"+v}
  return /^[A-Za-z][A-Za-z0-9_]{3,31}$/.test(v)?v:null}

function normCode(v){let c=toEn(v).toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.startsWith("LOCK"))c=c.slice(4);return c.length===8?`LOCK-${c.slice(0,4)}-${c.slice(4)}`:""}
const codeOK=c=>!!c&&ACT_H.has(sha256(ACT_SALT+c).slice(0,24));
function showActivation(){const b=$("#actb");b.innerHTML=`<div class="actc"><div class="stripe"></div><div class="wb en">WORKBOOK · 21 DAYS</div><div class="en actl">LOCK <span>IN</span></div>
  <p>برای شروع، اسمت و کد فعال‌سازی‌ای که برات فرستاده شده رو وارد کن.</p>
  <label class="fl">اسم و فامیل</label><input type="text" id="actn" autocomplete="name">
  <label class="fl">کد فعال‌سازی</label><input type="text" id="actc" dir="ltr" placeholder="LOCK-XXXX-XXXX" autocapitalize="characters" autocomplete="off" style="text-align:center;letter-spacing:.08em">
  <p class="acterr" id="acterr"></p><button class="btn y" id="actgo" style="width:100%;margin-top:6px">فعال‌سازی</button>
  <small class="actn2">هر کد مخصوص یه نفره و اسمت روی گزارش‌هایی که برای استاد می‌فرستی ثبت می‌شه.</small></div>`;b.hidden=false;
  const go=()=>{const n=$("#actn").value.trim(),c=normCode($("#actc").value);
    if(n.length<2){$("#acterr").textContent="اسمتو بنویس.";return}
    if(!codeOK(c)){$("#acterr").textContent="این کد درست نیست. دوباره چکش کن یا از پشتیبانی بپرس.";return}
    ACTV={name:n,code:c,at:new Date().toISOString()};try{localStorage.setItem(ACT_KEY,JSON.stringify(ACTV))}catch(e){}
    if(!S.name){S.name=n;persist()}b.hidden=true;b.innerHTML="";view=parseHash();render(true);toast("خوش اومدی "+n+" 🔒")};
  $("#actgo").onclick=go;$("#actc").onkeydown=e=>{if(e.key==="Enter")go()}}
const isActive=()=>!!(ACTV&&codeOK(ACTV.code));
/* ===== PWA ===== */
let DEFER=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFER=e;const b=document.getElementById("instbtn");if(b)b.hidden=false});
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function installView(){const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/i.test(ua),and=/Android/i.test(ua);
  return `<header class="dh"><div class="dnum en"><small>LOCK IN</small><b>APP</b></div><div><div class="meta"><span class="tag">${standalone()?"اپ نصب شده ✓":"نصب روی گوشی و کامپیوتر"}</span></div><h1>نصب اپ Lock In</h1></div></header>
  ${card("INSTALL","نصب سریع",`<p class="bp" style="margin-top:0">${standalone()?"الان داری از اپ نصب‌شده استفاده می‌کنی و همه‌چیز آفلاین هم کار می‌کنه.":"اپ رو یه بار نصب کن تا مثل یه برنامه معمولی از روی صفحه گوشی یا دسکتاپ باز بشه و بدون اینترنت هم کار کنه."}</p><button class="btn y" id="instbtn" data-act="install" ${DEFER?"":"hidden"}>نصب Lock In</button>`)}
  ${card("IPHONE","آیفون و آیپد"+(ios?" (همین دستگاه)":""),`<ol class="ol"><li>این صفحه رو توی <b>Safari</b> باز کن.</li><li>دکمه <b>Share</b> (مربع با فلش رو به بالا) رو بزن.</li><li><b>Add to Home Screen</b> رو انتخاب کن و بعد <b>Add</b> رو بزن.</li></ol>`)}
  ${card("ANDROID","اندروید"+(and?" (همین دستگاه)":""),`<ol class="ol"><li>فایل APK که برات فرستاده شده رو باز کن و نصبش کن.</li><li>یا این صفحه رو توی <b>Chrome</b> باز کن و از منوی ⋮ گزینه <b>نصب برنامه</b> رو بزن.</li></ol>`)}
  ${card("WINDOWS","ویندوز",`<ol class="ol"><li>این صفحه رو توی <b>Chrome</b> یا <b>Edge</b> باز کن.</li><li>آیکون نصب کنار نوار آدرس رو بزن، یا دکمه «نصب Lock In» بالای همین صفحه.</li></ol>`)}`}

if(isActive()){view=parseHash();render(true)}else showActivation();
</script>
</body>
</html>
